finsight:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_PG_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PG_PORT', '5433') | as_number }}"
      user: "{{ env_var('DBT_PG_USER', 'finsight') }}"
      password: "{{ env_var('DBT_PG_PASSWORD', 'finsight_dev_password') }}"
      dbname: "{{ env_var('DBT_PG_DBNAME', 'finsight') }}"
      schema: public
      threads: 4
      connect_timeout: 10
      retries: 2
