name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL and Redpanda
        run: docker compose up -d --wait postgres redpanda
      - name: Build tools image (pinned by constraints.txt)
        run: docker compose build tools
      - name: Lint
        run: docker compose run --rm tools ruff check src tests orchestration
      - name: Type check (mypy)
        run: docker compose run --rm tools mypy
      - name: Security regression gate (SQL attacks, DB role, masking, auth)
        run: make security
      - name: Full test suite (unit, integration, contract, ML, warehouse, agents)
        run: docker compose run --rm tools pytest -q
      - name: Golden Text-to-SQL set, reference mode (no LLM credentials needed)
        run: |
          docker compose run --rm tools sh -c 'finsight migrate && finsight seed --reset --entities-only && finsight produce --profile dev --limit 1500 && finsight consume --max-messages 1500 --idle-exit 20 && dbt build --project-dir warehouse/dbt --profiles-dir warehouse/dbt --target-path /tmp/t --log-path /tmp/l && finsight eval text2sql --mode reference'
        env: {}
      - if: failure()
        run: docker compose logs --no-color | tail -200

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api web
# LLM-backed evaluation (finsight eval text2sql --mode llm) needs ANTHROPIC_API_KEY and is intentionally NOT part of mandatory CI.
