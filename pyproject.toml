[project]
name = "finsight"
version = "0.1.0"
description = "FinSight: synthetic banking data, fraud detection and AI analytics platform"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3",
  "confluent-kafka>=2.5,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "sqlglot>=25,<31", "pyyaml>=6,<7", "anthropic>=0.40,<1",
  "langgraph>=0.2,<2", "prometheus-client>=0.20,<1", "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0", "opentelemetry-exporter-otlp-proto-http>=1.27,<2", "langgraph-checkpoint-postgres>=2,<4"]

[project.optional-dependencies]
ml = ["pandas>=2.2,<3", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "xgboost>=2.1,<4", "mlflow>=2.16,<4", "evidently>=0.4.40,<1"]
warehouse = ["dbt-postgres>=1.9,<1.10", "dagster>=1.9,<2", "dagster-dbt>=0.25,<1", "dagster-webserver>=1.9,<2"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
finsight = "finsight.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a running PostgreSQL (DATABASE_URL)",
  "live_claude: calls the REAL Anthropic API; opt-in (ANTHROPIC_API_KEY + RUN_LIVE_CLAUDE=1), budgeted",
  "live_network: contacts api.anthropic.com with an invalid key; opt-in (RUN_LIVE_NETWORK=1)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E741", "E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "orchestration"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

# third-party packages that ship no type information (no blanket ignores for our own code)
[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "mlflow.*", "evidently.*", "langgraph.*", "dagster.*", "dagster_dbt.*", "yaml", "sklearn.*", "xgboost.*", "pandas.*", "numpy.*", "sqlglot.*"]
ignore_missing_imports = true
